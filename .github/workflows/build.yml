name: Build Android APK (Smart Setup)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 1. فك ضغط ملف المشروع أولاً
      - name: Unzip project file
        run: |
          unzip wael_android_project.zip -d extracted_project

      # 2. ترتيب الملفات ونقلها للجذر
      - name: Merge and Setup Project
        run: |
          APP_PATH=$(find extracted_project -name "app" -type d -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: app folder not found in the zip file!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$APP_PATH")
          echo "Project root found at: $PROJECT_ROOT"
          
          mv "$PROJECT_ROOT"/* . 2>/dev/null || true
          mv "$PROJECT_ROOT"/.* . 2>/dev/null || true

      # 3. إعداد الجافا بعد تجهيز الملفات
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. توليد الـ Gradle الذكي داخل مشروعكِ الفعلي
      - name: Generate Missing Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. بناء التطبيق
      - name: Build APK
        run: ./gradlew assembleDebug

      # 6. رفع الملف الجاهز للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
