name: Build Android APK From Zip

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # خطوة فك ضغط ملف المشروع الخاص بكِ
      - name: Unzip project file
        run: |
          unzip wael_android_project.zip -d .
          # نقل الملفات للمجلد الرئيسي إذا كانت داخل مجلد فرعي بعد فك الضغط
          if [ -d "wael_android_project" ]; then
            mv wael_android_project/* .
            mv wael_android_project/.* . 2>/dev/null || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
