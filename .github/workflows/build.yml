name: Build Android APK (Final Fix)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Unzip project file
        run: |
          unzip wael_android_project.zip -d extracted_project

      - name: Merge and Setup Project
        run: |
          APP_PATH=$(find extracted_project -name "app" -type d -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: app folder not found in the zip file!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$APP_PATH")
          echo "Project root found at: $PROJECT_ROOT"
          mv "$PROJECT_ROOT"/* . 2>/dev/null || true
          mv "$PROJECT_ROOT"/.* . 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 🔥 التعديل الأساسي: نقوم بتهيئة البيئة فقط ونترك الخادم يكتشف الإصدار المناسب من ملفاتك تلقائياً
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # تنظيف الذاكرة المؤقتة والاعتماد على الكود الخاص بك مباشرة
      - name: Clean Project
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle clean || true

      # بناء التطبيق بأمر Gradle العام المضمون
      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
