name: Build Android APK From Zip

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Unzip project file
        run: |
          unzip wael_android_project.zip -d extracted_project
          
      - name: Find Project Root and Move Files
        run: |
          # البحث عن المجلد الذي يحتوي على ملف gradlew والتحرك إليه
          GRADLEW_PATH=$(find extracted_project -name "gradlew" -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found in the zip file!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          echo "Project root found at: $PROJECT_ROOT"
          # نقل كل المحتويات إلى المجلد الرئيسي للـ Repository
          mv "$PROJECT_ROOT"/* . 2>/dev/null || true
          mv "$PROJECT_ROOT"/.* . 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
