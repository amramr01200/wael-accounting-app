name: Build Android APK (Final Fix)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Unzip project file
        run: |
          unzip wael_android_project.zip -d extracted_project

      - name: Merge and Setup Project
        run: |
          APP_PATH=$(find extracted_project -name "app" -type d -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: app folder not found in the zip file!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$APP_PATH")
          echo "Project root found at: $PROJECT_ROOT"
          mv "$PROJECT_ROOT"/* . 2>/dev/null || true
          mv "$PROJECT_ROOT"/.* . 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      # تم تعديل الأمر هنا ليصبح gradle بدلاً من ./gradlew
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.0

      - name: Clean and Refresh Gradle Dependencies
        run: |
          chmod +x gradlew
          ./gradlew clean --refresh-dependencies || true

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
